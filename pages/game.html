<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="../scss/styles.css" />

		<title>Document</title>
	</head>
	<body>
		<section class="game-wrapper">
      <section class="main-game-area">
        <article class="game-info-wrapper">

          <h2 class="game-message">Ready?</h2>

          <article class="game-controls-wrapper">
            <article class="game-word-display-wrapper">
              <p>Your word is...</p>
              <h3 class="game-word"></h3>
            </article>
            <article class="wordbtn-timer-wraper">
              <button class="get-new-word-btn btns-and-links">Get new word</button>
            
              <article class="timer-wrapper">
                  <p class="timer-lbl">Timer:</p>
                  <p class="game-timer"></p>
              </article>
            </article>

            <article class="input-area">
              <form class="word-entry-form" action="">
                <label class="word-entry-lbl" for="word-entry"
                  >Enter a word</label
                >
                <div class="input-group">
                  <input
                    class="word-entry-input"
                    id="word-entry"
                    type="text"
                    autocomplete="off"
                    minlength="3"
                    placeholder="Enter a word"
                    required />
                  <!-- <div class="form-btn-wrapper">
                    <button class="submit-word-btn btns-and-links">Submit</button>
                    <button class="erase-letter-btn btns-and-links">&larr;</button>
                  </div> -->
                </div>
              </form>
              <div class="error-area">
                <p class="error-msg-lbl"></p>
              </div>
            </article>
          </article>
          <section class="start-game-wrapper"> <!-- was play-btn-wrapper -->
            <article class="level-select-wrapper">
              <p>Choose your level</p>
              <select name="level-select" class="level-select" id="level-select">
                <option value="easy">Easy (level 1)</option>
                <option value="normal" selected="selected">Normal (level 2)</option>
              </select>
            </article>

            <button class="start-game-btn btns-and-links">Play</button>
          </section>
          
        </article>

        <article class="found-words-wrapper">
          <div class="score-wrapper">
            <p class="game-progress">
              Words found: <span class="total-words-found">0</span>
            </p>
            <p class="game-progress">
              Points: <span class="total-points">0</span>
            </p>
          </div>
          <article class="guessed-words-section"></article>
        </article>
      
      </section>
      
      <div class="keyboard">
        <div class="letter-row row-1">
          <button class="key letter" ontouchstart="">Q</button>
          <button class="key letter" ontouchstart="">W</button>
          <button class="key letter" ontouchstart="">E</button>
          <button class="key letter" ontouchstart="">R</button>
          <button class="key letter" ontouchstart="">T</button>
          <button class="key letter" ontouchstart="">Y</button>
          <button class="key letter" ontouchstart="">U</button>
          <button class="key letter" ontouchstart="">I</button>
          <button class="key letter" ontouchstart="">O</button>
          <button class="key letter" ontouchstart="">P</button>
          <button class="key keyboard-delete" ontouchstart="">&#8676;</button>
        </div>
        <div class="letter-row row-2">
          <button class="key letter" ontouchstart="">A</button>
          <button class="key letter" ontouchstart="">S</button>
          <button class="key letter" ontouchstart="">D</button>
          <button class="key letter" ontouchstart="">F</button>
          <button class="key letter" ontouchstart="">G</button>
          <button class="key letter" ontouchstart="">H</button>
          <button class="key letter" ontouchstart="">J</button>
          <button class="key letter" ontouchstart="">K</button>
          <button class="key letter" ontouchstart="">L</button>
        </div>
        <div class="letter-row row-3">
          <button class="key letter" ontouchstart="">Z</button>
          <button class="key letter" ontouchstart="">X</button>
          <button class="key letter" ontouchstart="">C</button>
          <button class="key letter" ontouchstart="">V</button>
          <button class="key letter" ontouchstart="">B</button>
          <button class="key letter" ontouchstart="">N</button>
          <button class="key letter" ontouchstart="">M</button>
          <button class="key keyboard-submit" ontouchstart="">&#8629;</button>
        </div>
      </div>

		</section>
		<script src="../scripts/script.js" type="module"></script>
	</body>
</html>
